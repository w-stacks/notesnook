name: Build Docker Images

on:
  push:
    tags:
      - "**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream web version
        id: upstream
        env:
          UPSTREAM_PACKAGE_URL: https://raw.githubusercontent.com/streetwriters/notesnook/refs/heads/master/apps/web/package.json
          VERSION_FILE: .github/upstream-web-version
        run: |
          set -euo pipefail

          upstream_version=$(curl --fail --silent --show-error --location "$UPSTREAM_PACKAGE_URL" | jq --raw-output '.version')
          if [[ -z "$upstream_version" || "$upstream_version" == "null" ]]; then
            echo "Unable to read upstream web version" >&2
            exit 1
          fi

          should_build=false
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ ! -f "$VERSION_FILE" ]] || [[ "$(<"$VERSION_FILE")" != "$upstream_version" ]]; then
            should_build=true
          fi

          echo "upstream_version=$upstream_version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "Upstream web version: $upstream_version"
          echo "Build required: $should_build"

      - name: Docker meta
        id: meta
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GitHub Container Registry
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.upstream_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record successfully built upstream version
        if: steps.upstream.outputs.should_build == 'true' && github.event_name == 'schedule'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
        run: |
          set -euo pipefail

          printf '%s\n' "$UPSTREAM_VERSION" > .github/upstream-web-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/upstream-web-version
          git commit -m "chore: record upstream web version"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"